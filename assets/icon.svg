<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: bright sky blue to deep blue, top-left to bottom-right -->
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5AC8FF"/>
      <stop offset="0.55" stop-color="#1A7BFF"/>
      <stop offset="1" stop-color="#0A3FD6"/>
    </linearGradient>
    <!-- Soft glossy highlight on the upper half -->
    <radialGradient id="gloss" cx="0.3" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Bolt: white with a faint cool tint at the bottom -->
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001A4D" flood-opacity="0.35"/>
    </filter>
    <filter id="boltShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#002B80" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- macOS-style rounded tile on the standard 824px icon grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#tileShadow)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
    <!-- subtle diagonal light streak behind the bolt -->
    <path d="M 640 100 L 924 100 L 924 330 L 380 924 L 100 924 L 100 860 Z" fill="#FFFFFF" opacity="0.06"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Lightning bolt -->
  <path filter="url(#boltShadow)" fill="url(#bolt)" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"
        d="M 584 196 L 318 560 L 488 560 L 430 828 L 708 436 L 534 436 Z"/>
</svg>
