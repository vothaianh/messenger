[package]
name = "messenger-rs"
version = "1.0.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = { version = "0.37.0", features = ["all_loaders", "http"] }
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSDockTile", "NSResponder", "NSView", "NSWindow", "NSColor", "NSGraphics", "NSGlassEffectView", "NSVisualEffectView", "NSMenu", "NSMenuItem", "NSEvent", "NSImage", "NSFont", "NSStringDrawing", "NSAttributedString", "NSCell", "objc2-core-foundation", "block2", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSFontDescriptor", "NSButton", "NSControl", "NSPasteboard", "NSPasteboardItem", "NSAppearance", "NSBox"] }
objc2-foundation = "0.3.2"
prost = "0.14.4"
rand = "0.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies", "json", "multipart", "form", "query"] }
rfd = "0.17.2"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
hmac = "0.13"
hkdf = "0.13"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
unicode-normalization = "0.1.26"
url = "2.5.8"
urlencoding = "2.1.3"
uuid = { version = "1.29.0", features = ["v4"] }
wacore-binary = { version = "0.7", default-features = false }
wacore-libsignal = "0.7"
wacore-noise = "0.7"
waproto = "0.7"
wry = "0.57.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
xeddsa = "1.1.0"
yawc = { version = "0.5", default-features = false, features = ["rustls-aws-lc-rs"] }
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationTrigger", "UNNotification", "block2"] }
block2 = "0.6.2"
emojis = "0.9.1"
objc2-av-kit = { version = "0.3", features = ["AVPlayerView", "objc2-app-kit", "objc2-av-foundation"] }
objc2-av-foundation = { version = "0.3", features = ["AVPlayer", "AVPlayerItem", "AVAsset", "objc2-core-media"] }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKContentWorld", "WKFrameInfo", "WKNavigation", "block2", "objc2-app-kit"] }

[dev-dependencies]
resvg = "0.45.1"

[patch.crates-io]
# Messenger device JIDs (FB_JID) - see vendor/wacore-binary/VENDORED.md
wacore-binary = { path = "vendor/wacore-binary" }

# Distribution build (`DIST=1 ./bundle.sh`): smaller, slower to compile.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
